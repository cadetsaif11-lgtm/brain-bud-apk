name: Release BrainBuddy APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      release_name:
        description: "Release title"
        required: true
        default: "BrainBuddy v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK asset
        id: prep
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TITLE="${{ github.event.inputs.release_name || format('BrainBuddy {0}', github.ref_name) }}"
          APK_NAME="BrainBuddy-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.title }}
          body: |
            ## BrainBuddy — AI Study Companion
            Developed by **Abdullah Saif Bin Nazrul**

            ### What's Included
            - Convert notes & photos into flashcards and quizzes with Gemini AI
            - Interactive 3D flashcards with Text-to-Speech & mastery ratings
            - Smart quizzes with AI explanations & automatic weak-area flagging
            - AI Weak Area Detector & one-tap Booster Drills
            - Learning progress analytics, 7-day activity chart, AI Study Buddy chat & Focus Timer

            ### Installation
            Download `${{ steps.prep.outputs.apk }}` below and install it on your Android device (Android 7.0+ / API 24+).
          files: |
            ${{ steps.prep.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
